<svg xmlns="http://www.w3.org/2000/svg" width="180" height="40" viewBox="0 0 180 40" role="img" aria-label="SIOMS">
  <defs>
    <linearGradient id="sioms-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- logomark -->
  <g transform="translate(4,4)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#sioms-grad-dark)"/>
    <!-- box / inventory -->
    <rect x="7" y="9" width="18" height="12" rx="2" fill="#0f172a" fill-opacity="0.08" stroke="#dbeafe" stroke-width="1"/>
    <path d="M7 14h18" stroke="#dbeafe" stroke-width="1"/>
    <!-- small bar chart -->
    <rect x="9" y="22" width="3" height="6" rx="1" fill="#dbeafe"/>
    <rect x="14" y="20" width="3" height="8" rx="1" fill="#e5e7eb"/>
    <rect x="19" y="18" width="3" height="10" rx="1" fill="#bfdbfe"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(46,25)" fill="#f9fafb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="16" font-weight="700">SIOMS</text>
    <text x="0" y="10" font-size="8" fill="#cbd5f5" letter-spacing="0.04em">SMART INVENTORY &amp; ORDERS</text>
  </g>
</svg>


